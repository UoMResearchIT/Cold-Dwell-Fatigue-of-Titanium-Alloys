name: pytest

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make source paths visible to Docker daemon on host
        run: |
          sudo mkdir -p /opt/microtexture/src/microtexture
          sudo mount --bind ${{ github.workspace }}/src/microtexture /opt/microtexture/src/microtexture

      - name: Run tests with coverage
        run: |
          docker compose -f docker-compose-test.yaml run --build test uv run --dev python -m pytest -v \
            --cov=src/microtexture --cov-report=xml:src/microtexture/coverage.xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./src/microtexture/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
