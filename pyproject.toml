[project]
version = "0.5.0-rc"
name = "microtexture"
description = "Microtexture analysis and Dream3D pipeline automation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.4,<3",
    "matplotlib>=3.10.7,<4",
    "pandas>=2.3.3,<3",
    "scikit-image>=0.25.2,<0.26",
    "h5py>=3.13.0,<4",
    "openpyxl>=3.1.5,<4",
    "pyyaml>=6.0.3,<7",
    "jinja2>=3.1.6",
    "configargparse>=1.7.1",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.2.0",
]

[tool.setuptools.package-data]
microtexture = ["sample_data/*.ang"]

[project.scripts]
microtexture = "microtexture.cli:main"

[tool.microtexture.external-dependencies.conda]
channels = ["conda-forge", "bluequartzsoftware"]
environment = "nxpython"
python = "3.12"
package = "dream3dnx"

[tool.pixi.workspace]
channels = ["conda-forge", "bluequartzsoftware"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
dream3dnx = "*"

[tool.pixi.pypi-dependencies]
microtexture = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
setup-plugins = "bash scripts/setup-plugins.sh"
test = "pytest -q"
run-help = "python -m microtexture -h"
