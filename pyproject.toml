[project]
version = "0.3.0"
name = "microtexture"
description = "Microtexture analysis and Dream3D pipeline automation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.4,<3",
    "matplotlib>=3.10.7,<4",
    "pandas>=2.3.3,<3",
    "scikit-image>=0.25.2,<0.26",
    "h5py>=3.13.0,<4",
    "openpyxl>=3.1.5,<4",
    "pyyaml>=6.0.3,<7",
    "jinja2>=3.1.6",
    "configargparse>=1.7.1",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.16.0,<7",
]
gui = [
    "pillow>=12.0.0,<13",
    "psutil>=7.1.3,<8",
    "dotenv>=0.9.9",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.package-data]
microtexture = ["sample_data/*.ang"]

[project.scripts]
microtexture = "microtexture.cli:main"

# System dependencies: DREAM3D-6.5.171 must be installed (see Dockerfile)