# Defaults / config template

# {basename} will be replaced by the input file name without extension
output-dir: "./Results/{basename}"
summary-format: ["excel", "markdown"]

# C-Axis Misalignment Threshold (deg) for Pixel Segmentation:
caxis-misalignment: 20

# Minimum MTR Size, um^2
min-mtr-size: 10000

# Stress axis direction ('001', '010', '100')
stress-axis: '001'

# Parameters for .ang files ---

# Confidence Index (CI) Threshold for Good Data
ci-mask-threshold: 0.05
# Image Quality (IQ) Threshold for Good Data
iq-mask-threshold: 20000.0
# Primary Cleanup CI Threshold
ci-primary-threshold: 0.05
# Secondary Cleanup CI Threshold
ci-secondary-threshold: 0.1

# Cleanup parameters for .ctf files ---

# Error Mask (CI Threshold for Good Data)
error-mask-threshold: 1
# Primary Cleanup Band Contrast (BC) Threshold
bc-primary-threshold: 30
# Secondary Cleanup BC Threshold
bc-secondary-threshold: 50

# DREAM3D execution ---

# Path to DREAM3D PipelineRunner, override with $DREAM3D-PIPELINE-RUNNER
pipeline-runner: "/opt/dream3d/bin/PipelineRunner"

# Path to DREAM3D pipeline template, override with $DREAM3D-PIPELINE-TEMPLATE
# {EXT} / {ext} tokens will be replaced by the (upper / lower case) input file extension.
# {microtexture} stands for the path to this package.
pipeline-template: "{microtexture}/templates/PW_{EXT}_routine_v65.j2"
